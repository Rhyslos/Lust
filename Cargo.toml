[package]
name = "lust"
version = "2.0.0-alpha.26"
edition = "2021"
description = "The Lust programming language"
license = "MIT"

[[bin]]
name = "lust"
path = "src/main.rs"

[dependencies]
mlua = { version = "0.10", features = ["lua51", "vendored"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tiny_http = "0.12"
ureq = "3"
regex = "1"
winit = "0.30"
softbuffer = "0.4"
ab_glyph = "0.2"
arboard = { version = "3", default-features = false }
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
