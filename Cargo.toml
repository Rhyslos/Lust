[package]
name = "lust"
version = "2.0.0-alpha.73"
edition = "2021"
description = "The Lust programming language: its compiler, and the lust command"
repository = "https://github.com/Rhyslos/Lust"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lust"
path = "src/main.rs"
required-features = ["cli"]

# The compiler on its own (lust = { …, default-features = false }) needs nothing but Rust's own
# library. The lust command, with lust run, lust test and views, needs the rest.
[features]
default = ["cli"]
cli = ["dep:sha2", "dep:mlua", "dep:rusqlite", "dep:tiny_http", "dep:ureq", "dep:regex", "dep:winit", "dep:accesskit", "dep:accesskit_winit", "dep:softbuffer", "dep:ab_glyph", "dep:rfd", "dep:arboard", "dep:png", "dep:jpeg-decoder", "dep:resvg", "dep:tray-icon", "dep:tauri-winrt-notification", "dep:zbus"]

[dependencies]
mlua = { version = "0.10", features = ["lua51", "vendored"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
tiny_http = { version = "0.12", optional = true }
ureq = { version = "3", optional = true }
regex = { version = "1", optional = true }
winit = { version = "0.30", optional = true }
# Screen readers: the accessibility tree goes to UI Automation on Windows and AT-SPI on Linux.
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true }
softbuffer = { version = "0.4", optional = true }
ab_glyph = { version = "0.2", optional = true }
rfd = { version = "0.16", optional = true }
arboard = { version = "3", default-features = false, optional = true }
png = { version = "0.17", optional = true }
jpeg-decoder = { version = "0.3", default-features = false, optional = true }
# SVG pictures in views. Without its default features: no text in SVGs, and no pictures inside them.
resvg = { version = "0.49", default-features = false, optional = true }
# lust update checks downloads against the release's SHA256SUMS.
sha2 = { version = "0.10", optional = true }

# A view's tray icon, and App:notify's notifications, on Windows. tray-icon's Linux side needs
# GTK, so it's Windows only: on other systems a tray does nothing. Built programs forbid unsafe
# code, so notifications go through tauri-winrt-notification's safe wrapper.
[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", default-features = false, optional = true }
tauri-winrt-notification = { version = "0.8", optional = true }

# App:notify on Linux, through D-Bus: pure Rust, and already part of rfd's file boxes.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"], optional = true }

[profile.release]
opt-level = 3
