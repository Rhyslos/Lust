# Runs every test on Linux and Windows for each push and pull request.
# The Windows run also keeps a ready-made lust.exe: Actions tab → the latest run → Artifacts → lust-windows.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      # Failures are also shown as notes on the run, so they can be read without the full log.
      - name: Test
        run: |
          if ! target/release/lust test tests > test-output.txt 2>&1; then
            cat test-output.txt
            grep -E "FAIL" test-output.txt | while read -r line; do echo "::error::$line"; done
            exit 1
          fi
          cat test-output.txt

      - name: Keep lust.exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: lust-windows
          path: target/release/lust.exe
